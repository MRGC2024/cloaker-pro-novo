<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Entrar — Cloaker Precision OS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0a'/%3E%3Cpath d='M8 22V10h6.2c3.4 0 5.5 1.9 5.5 4.7 0 2.9-2.1 4.8-5.5 4.8H11.4V22H8zm3.4-5.3h2.6c1.6 0 2.5-.9 2.5-2.2S15.6 12.3 14 12.3h-2.6v4.4z' fill='%23f5f5f5'/%3E%3C/svg%3E" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a;
      --panel: #111111;
      --line: rgba(255, 255, 255, 0.08);
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --dim: #737373;
      --danger: #a3a3a3;
    }
    html { color-scheme: dark; }
    i[class^="ri-"], i[class*=" ri-"] {
      font-weight: 400 !important;
      font-style: normal;
      -webkit-text-stroke: 0;
      text-shadow: none;
    }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
    }
    .os-gate {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(280px, 0.92fr) minmax(320px, 1.08fr);
    }
    .os-gate-brand {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 48px;
      border-right: 1px solid var(--line);
      background: #0a0a0a;
    }
    .os-mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #f5f5f5;
      color: #0a0a0a;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.04em;
    }
    .os-kicker {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
      margin: 28px 0 12px;
    }
    .os-gate-brand h1 {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: clamp(36px, 5vw, 56px);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1.05;
      max-width: 9ch;
    }
    .os-gate-brand p {
      margin-top: 18px;
      max-width: 36ch;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }
    .os-gate-foot {
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 0.04em;
    }
    .os-gate-form {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 28px;
      background: var(--panel);
    }
    .os-form {
      width: 100%;
      max-width: 380px;
    }
    .os-form h2 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }
    .os-form > .lead {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
    }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }
    .form-input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #0a0a0a;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
    }
    .form-input::placeholder { color: #525252; }
    .form-input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.35);
    }
    .btn-login {
      width: 100%;
      margin-top: 8px;
      padding: 13px 18px;
      min-height: 48px;
      border-radius: 8px;
      border: 1px solid #f5f5f5;
      background: #f5f5f5;
      background-image: none;
      color: #0a0a0a;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: none;
      text-shadow: none;
    }
    .btn-login i {
      font-weight: 400;
      color: inherit;
      -webkit-text-stroke: 0;
      text-shadow: none;
    }
    .btn-login:hover { background: #e5e5e5; border-color: #e5e5e5; }
    .btn-login:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.45;
      display: none;
    }
    .msg.error {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--line);
      color: #e5e5e5;
    }
    .msg.success {
      display: block;
      border: 1px solid var(--line);
      color: #e5e5e5;
    }
    #setupBox {
      display: none;
      margin-top: 28px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }
    .setup-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 5px 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .setup-title {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.55;
    }
    @media (max-width: 860px) {
      .os-gate { grid-template-columns: 1fr; }
      .os-gate-brand {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: 28px 22px 22px;
      }
      .os-gate-brand h1 { font-size: 34px; max-width: none; }
      .os-gate-foot { display: none; }
      .os-gate-form { align-items: flex-start; padding: 28px 22px 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="os-gate">
    <aside class="os-gate-brand">
      <div>
        <span class="os-mark" aria-hidden="true">C</span>
        <p class="os-kicker">Precision OS</p>
        <h1>Operação de tráfego</h1>
        <p>Mesa, campanhas e bloqueio no mesmo chrome. Horário de Brasília.</p>
      </div>
      <p class="os-gate-foot">Cloaker · acesso restrito</p>
    </aside>
    <main class="os-gate-form">
      <div class="os-form">
        <h2>Entrar</h2>
        <p class="lead">Identifique-se para abrir o painel.</p>
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="username">Usuário</label>
            <input type="text" class="form-input" id="username" name="username" required autocomplete="username" placeholder="Usuário">
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Senha</label>
            <input type="password" class="form-input" id="password" name="password" required autocomplete="current-password" placeholder="Senha">
          </div>
          <button type="submit" class="btn-login" id="loginBtn">
            <i class="ri-login-circle-line"></i>
            <span>Iniciar sessão</span>
          </button>
          <div id="loginMsg" class="msg"></div>
        </form>

        <div id="setupBox">
          <div class="setup-badge">Primeiro acesso</div>
          <div class="setup-title">Sistema sem administrador. Configure a conta principal:</div>
          <form id="setupForm">
            <div class="form-group">
              <label class="form-label" for="setupUsername">Usuário admin</label>
              <input type="text" class="form-input" id="setupUsername" required minlength="2" placeholder="admin">
            </div>
            <div class="form-group">
              <label class="form-label" for="setupPassword">Senha</label>
              <input type="password" class="form-input" id="setupPassword" required minlength="6" placeholder="Mín. 6 caracteres">
            </div>
            <button type="submit" class="btn-login">
              <i class="ri-shield-user-line"></i>
              <span>Criar administrador</span>
            </button>
            <div id="setupMsg" class="msg"></div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    var loginMsg = document.getElementById('loginMsg');
    var setupBox = document.getElementById('setupBox');
    var setupMsg = document.getElementById('setupMsg');
    var loginBtn = document.getElementById('loginBtn');

    fetch('/api/me', { credentials: 'include' }).then(function(r) {
      if (r.ok) { window.location.href = '/'; return; }
      return fetch('/api/setup/check', { credentials: 'include' }).then(function(r2) { return r2.ok ? r2.json() : {}; });
    }).then(function(data) {
      if (data && data.setupRequired) setupBox.style.display = 'block';
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      loginMsg.className = 'msg';
      loginMsg.textContent = '';
      loginBtn.disabled = true;
      var form = e.target;
      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username: form.username.value.trim(), password: form.password.value })
      }).then(function(r) {
        return r.json().then(function(data) {
          if (r.ok) { window.location.href = '/'; return; }
          loginMsg.className = 'msg error';
          loginMsg.innerHTML = '<i class="ri-error-warning-line"></i><span>' + (data.error || 'Credenciais inválidas') + '</span>';
          loginBtn.disabled = false;
        });
      }).catch(function() {
        loginMsg.className = 'msg error';
        loginMsg.innerHTML = '<i class="ri-wifi-off-line"></i><span>Erro de conexão. Tente novamente.</span>';
        loginBtn.disabled = false;
      });
    });

    document.getElementById('setupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      setupMsg.className = 'msg';
      setupMsg.textContent = '';
      var form = e.target;
      fetch('/api/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username: form.setupUsername.value.trim(), password: form.setupPassword.value })
      }).then(function(r) {
        return r.json().then(function(data) {
          if (r.ok) { window.location.href = '/'; return; }
          setupMsg.className = 'msg error';
          setupMsg.innerHTML = '<i class="ri-error-warning-line"></i><span>' + (data.error || 'Erro ao criar administrador') + '</span>';
        });
      }).catch(function() {
        setupMsg.className = 'msg error';
        setupMsg.innerHTML = '<i class="ri-error-warning-line"></i><span>Erro de conexão</span>';
      });
    });
  </script>
</body>
</html>
